name: CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

permissions:
  contents: read

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install afmt
        env:
          AFMT_VERSION: v1.1.0
          AFMT_SHA256: f30c84a0f9c7cbf9a83e973dcd7f1632e4579e0fd1dc0c248dae577dce8df604
        run: |
          archive="$RUNNER_TEMP/afmt.tar.gz"
          curl -fsSL "https://github.com/xixiaofinland/afmt/releases/download/${AFMT_VERSION}/afmt-${AFMT_VERSION}-linux-x86_64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$AFMT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" afmt
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The AER action provisions its runtime and runs the Apex suite itself.
      - run: node scripts/gate.mjs --skip-apex

      - name: Apex tests (AER)
        uses: octoberswimmer/aer-dist@2947631f729f460303c9f1f560d00623fd9e2234 # v1.4.44
        with:
          source: sfdx-source/base
          version: v1.4.44

  code-analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli@2.158.7
          sf plugins install @salesforce/plugin-code-analyzer@5.13.0 --json
      - run: npm run analyze

  scratch-org:
    needs: fast-gate
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check Dev Hub configuration
        id: devhub
        env:
          DEVHUB_SFDX_AUTH_URL: ${{ secrets.DEVHUB_SFDX_AUTH_URL }}
        run: |
          if [ -n "$DEVHUB_SFDX_AUTH_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DEVHUB_SFDX_AUTH_URL is unset. Scratch-org tests are skipped."
          fi

      - name: Install Salesforce CLI
        if: steps.devhub.outputs.available == 'true'
        run: npm install --global @salesforce/cli@2.158.7

      - name: Deploy and test base in a scratch org
        if: steps.devhub.outputs.available == 'true'
        env:
          DEVHUB_SFDX_AUTH_URL: ${{ secrets.DEVHUB_SFDX_AUTH_URL }}
        run: |
          auth="$(mktemp)"
          trap 'rm -f "$auth"' EXIT
          printf '%s' "$DEVHUB_SFDX_AUTH_URL" > "$auth"
          sf org login sfdx-url --sfdx-url-file "$auth" --alias devHub --json > /dev/null
          rm -f "$auth"
          node scripts/run-apex-tests.mjs
