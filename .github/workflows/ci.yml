name: CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

permissions:
  contents: read

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install afmt
        env:
          AFMT_VERSION: v1.1.0
        run: |
          curl -fsSL "https://github.com/xixiaofinland/afmt/releases/download/${AFMT_VERSION}/afmt-${AFMT_VERSION}-linux-x86_64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" afmt
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - run: npm test
      - run: npm run format:apex:check

      - name: Apex tests (AER)
        uses: octoberswimmer/aer-dist@v1.4.44
        with:
          source: sfdx-source/base
          version: v1.4.44

  code-analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli
          sf plugins install @salesforce/plugin-code-analyzer@5.13.0 --json
      - run: npm run analyze

  scratch-org:
    needs: fast-gate
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check Dev Hub configuration
        id: devhub
        env:
          DEVHUB_SFDX_AUTH_URL: ${{ secrets.DEVHUB_SFDX_AUTH_URL }}
        run: |
          if [ -n "$DEVHUB_SFDX_AUTH_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DEVHUB_SFDX_AUTH_URL is unset. Scratch-org tests are skipped."
          fi

      - name: Install Salesforce CLI
        if: steps.devhub.outputs.available == 'true'
        run: npm install --global @salesforce/cli

      - name: Deploy and test base in a scratch org
        if: steps.devhub.outputs.available == 'true'
        env:
          DEVHUB_SFDX_AUTH_URL: ${{ secrets.DEVHUB_SFDX_AUTH_URL }}
        run: |
          auth="$(mktemp)"
          trap 'rm -f "$auth"' EXIT
          printf '%s' "$DEVHUB_SFDX_AUTH_URL" > "$auth"
          sf org login sfdx-url --sfdx-url-file "$auth" --alias devHub --json > /dev/null
          rm -f "$auth"
          node scripts/run-apex-tests.mjs
